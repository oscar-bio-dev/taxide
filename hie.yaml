cradle:
  cabal:
    - path: "./taxide-core/src"
      component: "taxide-core:lib:taxide-core"
    - path: "./taxide-core/test"
      component: "taxide-core:test:taxide-core-test"
    - path: "./taxide-delta/src"
      component: "taxide-delta:lib:taxide-delta"
    - path: "./taxide-delta/app"
      component: "taxide-delta:exe:taxide-fmt"
    - path: "./taxide-delta/test"
      component: "taxide-delta:test:taxide-delta-test"
    - path: "./taxide-engine/src"
      component: "taxide-engine:lib:taxide-engine"
    - path: "./taxide-engine/app/Main.hs"
      component: "taxide-engine:exe:taxide-lint"
    - path: "./taxide-engine/app/TreeMain.hs"
      component: "taxide-engine:exe:taxide-tree"
    - path: "./taxide-engine/app/KeyMain.hs"
      component: "taxide-engine:exe:taxide-key"
    - path: "./taxide-engine/test"
      component: "taxide-engine:test:taxide-engine-test"
    - path: "./taxide-export/src"
      component: "taxide-export:lib:taxide-export"
    - path: "./taxide-export/app"
      component: "taxide-export:exe:taxide-compile"
    - path: "./taxide-export/test"
      component: "taxide-export:test:taxide-export-test"
    - path: "./taxide-tui/src"
      component: "taxide-tui:lib:taxide-tui"
    - path: "./taxide-tui/test"
      component: "taxide-tui:test:taxide-tui-test"
    - path: "./taxide-app/app"
      component: "taxide-app:exe:taxide"

